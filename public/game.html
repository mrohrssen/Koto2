<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NEO TOKYO: System Liberation</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌃</text></svg>">
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NEO TOKYO">
  <link rel="apple-touch-icon" href="/assets/icons/app-180.webp">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <div class="game-app">
    <!-- Status Bar -->
    <div class="status-bar" id="status-bar">
      <span class="status-floor" id="floor-indicator">Hub</span>
      <span class="status-essence" id="essence-display">0</span>
    </div>

    <!-- Scene Area -->
    <div class="scene-area" id="scene-area">
      <!-- Combat effect overlays -->
      <div class="screen-flash-overlay" id="screen-flash-overlay"></div>
      <div class="vignette-overlay" id="vignette-overlay"></div>
      <div class="scene-background" id="scene-background"></div>
      <div class="enemy-info" id="enemy-info">
        <span class="enemy-name" id="enemy-name"></span>
        <div class="enemy-hp-bar" id="enemy-hp-bar">
          <div class="enemy-hp-fill" id="enemy-hp-fill"></div>
          <span class="enemy-hp-text" id="enemy-hp-text"></span>
        </div>
        <div class="enemy-skill-bar" id="enemy-skill-bar"></div>
      </div>
      <div class="enemy-sprite-container" id="enemy-sprite-container">
        <img id="enemy-sprite" class="enemy-sprite" src="" alt="">
      </div>
      <div class="scene-toast" id="scene-toast"></div>
      <div class="narration-box" id="narration-box">
        <div class="narration-speaker" id="narration-speaker"></div>
        <div class="narration-text" id="narration-text"></div>
        <div class="narration-indicator">▼</div>
      </div>
    </div>

    <!-- Chip Row (also used for robot slots) -->
    <div class="chip-row" id="chip-row">
      <!-- 5 chip slots or 3 robot slots rendered by JS -->
    </div>

    <!-- Player HP Bar -->
    <div class="player-hp-container" id="player-hp-container">
      <div class="player-hp-bar" id="player-hp-bar">
        <div class="player-hp-fill" id="player-hp-fill"></div>
        <span class="player-hp-text" id="player-hp-text"></span>
      </div>
    </div>

    <!-- Bottom Action Area -->
    <div class="action-area" id="action-area">
      <!-- Buttons OR flash cards rendered by JS -->
    </div>

    <!-- Mini Toolbar -->
    <div class="mini-toolbar" id="mini-toolbar">
      <button class="toolbar-btn" id="lookup-btn" aria-label="Lookup">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
      <button class="toolbar-btn" id="bots-btn" aria-label="Bots">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
        </svg>
      </button>
      <button class="toolbar-btn" id="menu-btn" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Menu slide-up sheet -->
    <div class="menu-backdrop" id="menu-backdrop"></div>
    <div class="menu-sheet" id="menu-sheet">
      <div class="menu-handle"></div>
      <button class="menu-item" id="settings-btn"><span class="menu-icon">&#9881;</span> Settings</button>
      <button class="menu-item" id="leaderboard-btn"><span class="menu-icon">&#127942;</span> Leaderboard</button>
      <button class="menu-item" id="reset-run-btn"><span class="menu-icon">&#10005;</span> Reset Run</button>
      <button class="menu-item" id="bug-report-btn"><span class="menu-icon">&#128027;</span> Bug Report</button>
      <button class="menu-item menu-item-danger" id="logout-btn"><span class="menu-icon">&#8594;</span> Logout</button>
    </div>

    <!-- Bug Report Modal -->
    <div class="bug-report-modal" id="bug-report-modal">
      <div class="bug-report-content">
        <h3 class="bug-report-title">Report Issue</h3>
        <label class="bug-report-label">
          Screenshot
          <input type="file" id="bug-report-file" accept="image/*" class="bug-report-file">
        </label>
        <img id="bug-report-preview" class="bug-report-preview" style="display: none;" alt="Preview">
        <label class="bug-report-label">
          Notes (optional)
          <textarea id="bug-report-note" class="bug-report-input bug-report-textarea"
            placeholder="Describe the issue..." maxlength="500"></textarea>
        </label>
        <div class="bug-report-buttons">
          <button class="bug-report-cancel" id="bug-report-cancel">Cancel</button>
          <button class="bug-report-submit" id="bug-report-submit">Submit</button>
        </div>
      </div>
    </div>

    <!-- Lookup Popup -->
    <div class="lookup-popup" id="lookup-popup">
      <div class="lookup-popup-header">
        <div>
          <span class="lookup-popup-word" id="lookup-popup-word"></span>
          <span class="lookup-popup-reading" id="lookup-popup-reading"></span>
        </div>
        <button class="lookup-popup-close" id="lookup-popup-close">&times;</button>
      </div>
      <div class="lookup-popup-pos" id="lookup-popup-pos"></div>
      <ul class="lookup-popup-meanings" id="lookup-popup-meanings"></ul>
      <div class="lookup-popup-state" id="lookup-popup-state">
        <span class="lookup-state-dot" id="lookup-state-dot"></span>
        <span id="lookup-state-text"></span>
      </div>
    </div>
  </div>

  <!-- Full-Screen Takeover Views (hidden by default) -->
  <div class="takeover" id="robot-equip-view">
    <button class="takeover-close" id="robot-equip-close">&times;</button>
    <div class="takeover-content" id="robot-equip-content"></div>
  </div>

  <div class="takeover" id="settings-view">
    <button class="takeover-close" id="settings-close">&times;</button>
    <div class="takeover-content" id="settings-content"></div>
  </div>

  <div class="takeover" id="gameover-view">
    <div class="takeover-content" id="gameover-content"></div>
  </div>

  <div class="takeover" id="leaderboard-view">
    <button class="takeover-close" id="leaderboard-close">&times;</button>
    <div class="takeover-content" id="leaderboard-content"></div>
  </div>

  <div class="takeover" id="speed-review-view">
    <div class="speed-review-header">
      <span class="speed-review-counter" id="speed-review-counter">Cards Reviewed: 0 / 0</span>
      <button class="speed-review-undo inactive" id="speed-review-undo" title="Undo (5s)">
        <svg class="speed-review-undo-ring" viewBox="0 0 36 36">
          <circle class="ring-bg" cx="18" cy="18" r="16" fill="none" stroke="#333" stroke-width="2"/>
          <circle class="ring-progress" cx="18" cy="18" r="16" fill="none" stroke-width="2"
            stroke-dasharray="100.53" stroke-dashoffset="0" transform="rotate(-90 18 18)"/>
        </svg>
        <svg class="undo-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
      </button>
      <button class="takeover-close" id="speed-review-close">&times;</button>
    </div>
    <div class="speed-review-content" id="speed-review-content">
      <div class="speed-review-slot" id="speed-review-slot-0"></div>
      <div class="speed-review-slot" id="speed-review-slot-1"></div>
      <div class="speed-review-slot" id="speed-review-slot-2"></div>
    </div>
    <div class="speed-review-empty" id="speed-review-empty" style="display: none;">
      <div class="speed-review-complete-text">復習完了!</div>
    </div>
  </div>

  <!-- Popup (used by robot-row.js) -->
  <div class="chip-popup" id="chip-popup"></div>

  <!-- Auth Screen (shown before login) -->
  <div class="auth-screen" id="auth-screen">
    <div class="auth-container">
      <h1 class="auth-title">NEO TOKYO</h1>
      <p class="auth-subtitle">System Liberation</p>

      <div class="auth-form" id="auth-form">
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Login</button>
          <button class="auth-tab" data-tab="register">Register</button>
        </div>

        <div class="auth-fields" id="auth-fields">
          <input type="text" id="auth-username" placeholder="Username" autocomplete="username" />
          <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password" />
          <input type="text" id="auth-invite" placeholder="Invite Code" class="hidden" />
          <button class="btn-primary" id="auth-submit">Login</button>
          <p class="auth-error hidden" id="auth-error"></p>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
