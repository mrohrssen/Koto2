<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feature Mockups — Koto Dev</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
    }
    .dev-nav{display:flex;gap:2px;padding:6px 12px;background:#0a0a1a;border-bottom:1px solid #1e2d4a;overflow-x:auto}
    .dev-nav a{padding:5px 10px;border-radius:4px;font-size:12px;color:#667;text-decoration:none;white-space:nowrap;transition:all .15s}
    .dev-nav a:hover{color:#aab;background:#16213e}
    .dev-nav a.active{color:#8cf;background:#0f3460}
    .header {
      max-width: 600px;
      margin: 0 auto 1.5rem;
    }
    .header a {
      color: #6699cc;
      text-decoration: none;
      font-size: 0.85rem;
    }
    .header a:hover { text-decoration: underline; }
    h1 {
      font-size: 1.3rem;
      color: #a0c4ff;
      margin-top: 0.5rem;
    }
    .list {
      max-width: 600px;
      margin: 0 auto;
      list-style: none;
    }
    .list li {
      border-bottom: 1px solid #0f3460;
    }
    .list a {
      display: block;
      padding: 0.75rem 0;
      color: #e0e0e0;
      text-decoration: none;
      text-transform: capitalize;
      font-size: 0.95rem;
    }
    .list a:hover { color: #a0c4ff; }
    .list .filename {
      font-size: 0.75rem;
      color: #556677;
      margin-left: 0.5rem;
    }
    .empty {
      text-align: center;
      color: #556677;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
<nav class="dev-nav">
  <a href="/dev/">Hub</a>
  <a href="/forge.html">Forge</a>
  <a href="/dev/sprites">Sprites</a>
  <a href="/dev/content">Content</a>
  <a href="/creatures-gallery.html">Creatures</a>
  <a href="/regen-review.html">Regen Review</a>
  <a href="/assets/sprites/items/review.html">Items Review</a>
  <a href="/dev/mockups" class="active">Mockups</a>
</nav>
<div style="padding:2rem">
  <div class="header">
    <h1>Feature Mockups</h1>
  </div>
  <ul class="list" id="mockup-list"></ul>
  <p class="empty" id="empty" style="display:none">No mockups found.</p>
  <script>
    fetch('/dev/api/mockups')
      .then(r => r.json())
      .then(items => {
        const list = document.getElementById('mockup-list');
        if (!items.length) {
          document.getElementById('empty').style.display = '';
          return;
        }
        for (const item of items) {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = '/' + item.file;
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = item.name;
          const span = document.createElement('span');
          span.className = 'filename';
          span.textContent = item.file;
          a.appendChild(span);
          li.appendChild(a);
          list.appendChild(li);
        }
      })
      .catch(() => {
        document.getElementById('empty').style.display = '';
        document.getElementById('empty').textContent = 'Failed to load mockups.';
      });
  </script>
</div>
</body>
</html>
