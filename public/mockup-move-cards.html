<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Move Card Layout Mockups</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 12px;
  }

  h2 {
    text-align: center;
    font-size: 14px;
    color: #64b5f6;
    margin: 12px 0 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .phone-frame {
    width: 393px;
    margin: 0 auto 24px;
    background: #0d0d1a;
    border-radius: 16px;
    overflow: hidden;
    border: 2px solid #333;
  }

  /* ===== SHARED ===== */
  .move-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 10px;
    height: 420px;
  }
  .move-grid.vertical .move-cell,
  .move-grid.horizontal .move-cell {
    background: rgba(0,0,0,0.7);
    border: 2px solid #444;
    border-radius: 12px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .element-accent-fire { border-color: #F44336 !important; }
  .element-accent-water { border-color: #2196F3 !important; }
  .element-accent-wood { border-color: #4CAF50 !important; }
  .element-accent-neutral { border-color: #888 !important; }

  .move-icon {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }

  .furigana {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    line-height: 1;
    letter-spacing: 2px;
  }
  .kanji {
    font-size: 28px;
    font-weight: bold;
    line-height: 1.15;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    font-size: 13px;
  }
  .power { color: #ff9800; font-weight: bold; }
  .mp-cost { color: #64b5f6; font-weight: bold; }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 2px 8px;
    font-size: 11px;
    color: rgba(255,255,255,0.7);
  }
  .status-pill .turns {
    color: #ff9800;
    font-weight: bold;
  }

  .items-cell {
    background: rgba(255,255,255,0.05) !important;
    border: 2px dashed #555 !important;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border-radius: 12px;
    cursor: pointer;
  }
  .items-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
  }
  .items-label {
    font-size: 14px;
    color: rgba(255,255,255,0.5);
    font-weight: 600;
  }

  /* Element bottom bar */
  .element-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
  }
  .element-bar.fire { background: #F44336; }
  .element-bar.water { background: #2196F3; }
  .element-bar.wood { background: #4CAF50; }
  .element-bar.neutral { background: #888; }

  /* ===== VERTICAL (Option B) ===== */
  .move-grid.vertical .move-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    gap: 4px;
  }
  .move-grid.vertical .move-icon {
    margin-bottom: 4px;
  }
  .move-grid.vertical .stat-row {
    margin-top: auto;
    padding-top: 4px;
  }
  .move-grid.vertical .status-row {
    display: flex;
    gap: 4px;
    margin-top: 2px;
  }

  /* ===== HORIZONTAL (Option A) ===== */
  .move-grid.horizontal .move-cell {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    padding: 14px;
    gap: 14px;
  }
  .move-grid.horizontal .move-icon {
    margin-top: 2px;
  }
  .move-grid.horizontal .move-text {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-height: 100%;
  }
  .move-grid.horizontal .stat-row {
    margin-top: auto;
    padding-top: 8px;
  }
  .move-grid.horizontal .status-row {
    display: flex;
    gap: 4px;
    margin-top: 2px;
  }

  /* Label bar */
  .label-bar {
    background: rgba(100,181,246,0.15);
    text-align: center;
    padding: 6px;
    font-size: 13px;
    color: #64b5f6;
    font-weight: 600;
  }

  /* Both layouts side by side on wide screens */
  .layouts {
    display: flex;
    gap: 24px;
    justify-content: center;
    flex-wrap: wrap;
  }
</style>
</head>
<body>

<div class="layouts">

<!-- ===== VERTICAL LAYOUT ===== -->
<div>
  <h2>Option B: Vertical (Icon-Top)</h2>
  <div class="phone-frame">
    <div class="label-bar">Hanatchi's turn</div>
    <div class="move-grid vertical">
      <!-- Move 1: Fire damage + poison -->
      <div class="move-cell element-accent-fire">
        <div class="move-icon">🔥</div>
        <div class="furigana">はなつ</div>
        <div class="kanji">放つ</div>
        <div class="stat-row">
          <span class="power">⚔ 25</span>
          <span class="mp-cost">10 MP</span>
        </div>
        <div class="status-row">
          <span class="status-pill">☠ poison <span class="turns">2T</span></span>
        </div>
        <div class="element-bar fire"></div>
      </div>

      <!-- Move 2: Water buff, no status -->
      <div class="move-cell element-accent-water">
        <div class="move-icon">✨</div>
        <div class="furigana">ひかる</div>
        <div class="kanji">光る</div>
        <div class="stat-row">
          <span class="power">★ 30</span>
          <span class="mp-cost">12 MP</span>
        </div>
        <div class="status-row"></div>
        <div class="element-bar water"></div>
      </div>

      <!-- Move 3: Wood shield + shield status -->
      <div class="move-cell element-accent-wood">
        <div class="move-icon">🛡</div>
        <div class="furigana">かくれる</div>
        <div class="kanji">隠れる</div>
        <div class="stat-row">
          <span class="power">🛡 25</span>
          <span class="mp-cost">8 MP</span>
        </div>
        <div class="status-row">
          <span class="status-pill">🛡 shield <span class="turns">2T</span></span>
        </div>
        <div class="element-bar wood"></div>
      </div>

      <!-- Items -->
      <div class="items-cell">
        <div class="items-icon">🎒</div>
        <div class="items-label">Items</div>
      </div>
    </div>
  </div>
</div>

<!-- ===== HORIZONTAL LAYOUT ===== -->
<div>
  <h2>Option A: Horizontal (Icon-Left)</h2>
  <div class="phone-frame">
    <div class="label-bar">Hanatchi's turn</div>
    <div class="move-grid horizontal">
      <!-- Move 1: Fire damage + poison -->
      <div class="move-cell element-accent-fire">
        <div class="move-icon">🔥</div>
        <div class="move-text">
          <div class="furigana">はなつ</div>
          <div class="kanji">放つ</div>
          <div class="stat-row">
            <span class="power">⚔ 25</span>
            <span class="mp-cost">10 MP</span>
          </div>
          <div class="status-row">
            <span class="status-pill">☠ poison <span class="turns">2T</span></span>
          </div>
        </div>
        <div class="element-bar fire"></div>
      </div>

      <!-- Move 2: Water buff, no status -->
      <div class="move-cell element-accent-water">
        <div class="move-icon">✨</div>
        <div class="move-text">
          <div class="furigana">ひかる</div>
          <div class="kanji">光る</div>
          <div class="stat-row">
            <span class="power">★ 30</span>
            <span class="mp-cost">12 MP</span>
          </div>
          <div class="status-row"></div>
        </div>
        <div class="element-bar water"></div>
      </div>

      <!-- Move 3: Wood shield + shield status -->
      <div class="move-cell element-accent-wood">
        <div class="move-icon">🛡</div>
        <div class="move-text">
          <div class="furigana">かくれる</div>
          <div class="kanji">隠れる</div>
          <div class="stat-row">
            <span class="power">🛡 25</span>
            <span class="mp-cost">8 MP</span>
          </div>
          <div class="status-row">
            <span class="status-pill">🛡 shield <span class="turns">2T</span></span>
          </div>
        </div>
        <div class="element-bar wood"></div>
      </div>

      <!-- Items -->
      <div class="items-cell">
        <div class="items-icon">🎒</div>
        <div class="items-label">Items</div>
      </div>
    </div>
  </div>
</div>

</div>

</body>
</html>
