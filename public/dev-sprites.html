<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprite Review Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;color:#e0e0e0;font-family:system-ui,-apple-system,sans-serif;min-height:100vh}

/* Dev nav */
.dev-nav{display:flex;gap:2px;padding:6px 12px;background:#0a0a1a;border-bottom:1px solid #1e2d4a;overflow-x:auto}
.dev-nav a{padding:5px 10px;border-radius:4px;font-size:12px;color:#667;text-decoration:none;white-space:nowrap;transition:all .15s}
.dev-nav a:hover{color:#aab;background:#16213e}
.dev-nav a.active{color:#8cf;background:#0f3460}

/* Top bar */
.topbar{position:sticky;top:0;z-index:100;background:#0f0f23;border-bottom:1px solid #1e2d4a;padding:8px 12px}
.topbar-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;flex-shrink:0;overflow-x:auto}
.tab{padding:6px 12px;border:none;border-radius:6px;background:#16213e;color:#8899aa;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
.tab:hover{background:#1e2d4a;color:#c0d0e0}
.tab.active{background:#0f3460;color:#fff}
.search{flex:1;min-width:120px;max-width:280px;padding:6px 10px;border:1px solid #1e2d4a;border-radius:6px;background:#16213e;color:#e0e0e0;font-size:13px;outline:none}
.search:focus{border-color:#0f3460}
.search::placeholder{color:#556}
.toggle{display:flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid #1e2d4a;border-radius:6px;background:#16213e;color:#8899aa;cursor:pointer;font-size:12px;white-space:nowrap;user-select:none}
.toggle.on{border-color:#e67e22;color:#e67e22;background:#2a1a0a}
.toggle.flagged-on{border-color:#e74c3c;color:#e74c3c;background:#2a0a0a}
.stats{font-size:12px;color:#667;white-space:nowrap;margin-left:auto}
.refresh-btn{padding:4px 10px;border:1px solid #1e2d4a;border-radius:6px;background:#16213e;color:#8899aa;cursor:pointer;font-size:14px}
.refresh-btn:hover{background:#1e2d4a;color:#e0e0e0}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:12px}
.card{background:#16213e;border-radius:8px;padding:10px;cursor:pointer;transition:all .15s;border:2px solid transparent;text-align:center;position:relative}
.card:hover{border-color:#0f3460;transform:translateY(-2px)}
.card-img-wrap{width:100px;height:100px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;position:relative}
.card-img-wrap img{max-width:100%;max-height:100%;object-fit:contain}
.card-img-wrap .placeholder{width:60px;height:60px;border-radius:8px;background:#0f0f23;display:flex;align-items:center;justify-content:center;color:#445;font-size:24px}
.card-name{font-size:13px;font-weight:500;color:#e0e0e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-jp{font-size:11px;color:#667;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:4px;right:4px;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600}
.badge-orphan{background:#e67e22;color:#fff}
.badge-flagged{background:#e74c3c;color:#fff}
.badge-missing{background:#555;color:#ccc}

/* Creature idle animation - show idle by default, static on hover */
.card-img-wrap .img-idle{display:block}
.card-img-wrap .img-static{display:none}
.card:hover .card-img-wrap .img-idle{display:none}
.card:hover .card-img-wrap .img-static{display:block}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.modal{background:#16213e;border-radius:12px;padding:20px;max-width:420px;width:100%;max-height:90vh;overflow-y:auto;position:relative}
.modal.modal-wide{max-width:680px}
.modal-close{position:absolute;top:10px;right:12px;background:none;border:none;color:#889;font-size:22px;cursor:pointer;padding:4px 8px}
.modal-close:hover{color:#e0e0e0}
.modal-sprites{display:flex;gap:16px;justify-content:center;margin:12px 0}
.modal-sprites figure{text-align:center}
.modal-sprites figcaption{font-size:11px;color:#667;margin-top:4px}
.modal-sprites img{width:150px;height:150px;object-fit:contain}
.modal-meta{margin:12px 0;font-size:13px;line-height:1.8}
.modal-meta span{display:inline-block;padding:2px 8px;border-radius:4px;background:#0f0f23;margin:2px 4px 2px 0;font-size:12px}
.modal h3{font-size:16px;margin-bottom:4px}
.modal .jp-name{font-size:13px;color:#889;margin-bottom:8px}

/* Feedback */
.feedback-section{margin-top:16px;border-top:1px solid #1e2d4a;padding-top:12px}
.feedback-section h4{font-size:13px;color:#889;margin-bottom:8px}
.feedback-notes{list-style:none;margin-bottom:10px}
.feedback-notes li{padding:6px 8px;background:#0f0f23;border-radius:4px;margin-bottom:4px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.feedback-notes li button{background:none;border:none;color:#e74c3c;cursor:pointer;font-size:14px;padding:0 4px}
.feedback-row{display:flex;gap:6px}
.feedback-input{flex:1;padding:6px 10px;border:1px solid #1e2d4a;border-radius:6px;background:#0f0f23;color:#e0e0e0;font-size:13px;outline:none}
.feedback-input:focus{border-color:#0f3460}
.btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500}
.btn-flag{background:#e74c3c;color:#fff}
.btn-flag:hover{background:#c0392b}
.btn-clear{background:#333;color:#aaa;margin-top:8px;font-size:12px}
.btn-clear:hover{background:#444;color:#e0e0e0}
/* Background thumbnail - wider aspect ratio */
.card-img-wrap.bg-thumb{width:100%;height:70px}
.card-img-wrap.bg-thumb img{border-radius:4px}

/* Background gallery in modal */
.modal-bg-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:12px 0;max-height:50vh;overflow-y:auto;padding:4px}
.modal-bg-gallery figure{text-align:center}
.modal-bg-gallery img{width:100%;border-radius:4px;cursor:pointer;transition:transform .15s}
.modal-bg-gallery img:hover{transform:scale(1.05)}
.modal-bg-gallery figcaption{font-size:10px;color:#667;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:#556;font-size:14px}

/* Review tab */
.review-entry{background:#16213e;border-radius:8px;padding:16px;margin-bottom:16px}
.review-header{font-size:15px;font-weight:600;margin-bottom:12px;border-bottom:1px solid #1e2d4a;padding-bottom:8px}
.review-header .jp{color:#889;font-weight:400;margin-left:8px}
.review-candidates{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.review-candidate{background:#0f0f23;border-radius:8px;padding:12px;text-align:center;border:2px solid transparent;transition:border-color .15s}
.review-candidate:hover{border-color:#0f3460}
.review-candidate img{width:128px;height:128px;object-fit:contain;display:block;margin:0 auto 8px}
.review-candidate.large img{width:200px;height:200px}
.review-scores{font-size:12px;line-height:1.8;margin:8px 0}
.review-scores .score{display:inline-block;padding:1px 6px;border-radius:3px;margin:1px}
.score-green{background:#1a3a1a;color:#4ade80}
.score-yellow{background:#3a3a1a;color:#fbbf24}
.score-red{background:#3a1a1a;color:#f87171}
.review-total{font-size:14px;font-weight:600;color:#8cf;margin-bottom:4px}
.review-rejected{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.review-rejected-item{background:#1a1a1a;border-radius:6px;padding:8px;text-align:center;opacity:.5;font-size:11px;max-width:100px}
.review-rejected-item img{width:64px;height:64px;object-fit:contain;filter:grayscale(1);display:block;margin:0 auto 4px}
.review-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.btn-pick{background:#0f3460;color:#fff;padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px}
.btn-pick:hover{background:#1a4a80}
.btn-reject{background:#4a1a1a;color:#f87171;padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px}
.btn-reject:hover{background:#5a2020}
.btn-batch{background:#1a3a1a;color:#4ade80;padding:8px 18px;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:500;margin-bottom:12px}
.btn-batch:hover{background:#2a4a2a}
.reject-note-input{padding:6px 10px;border:1px solid #1e2d4a;border-radius:6px;background:#0f0f23;color:#e0e0e0;font-size:13px;outline:none;width:200px}
.review-sort{margin-bottom:12px;display:flex;gap:8px;align-items:center;font-size:13px;color:#889}
.review-sort select{padding:4px 8px;background:#0f0f23;color:#e0e0e0;border:1px solid #1e2d4a;border-radius:4px;font-size:13px}
.review-list{padding:12px;display:block}
.grid:has(.review-list){display:block}

/* QA failures tab */
.qa-entry{background:#16213e;border-radius:8px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:8px;border-left:3px solid #f87171}
.qa-entry.qa-broken{border-left-color:#ff4444}
.qa-entry img{width:80px;height:80px;object-fit:contain;flex-shrink:0;border-radius:4px;background:#0f0f23}
.qa-info{flex:1;min-width:0}
.qa-name{font-size:14px;font-weight:600;margin-bottom:4px}
.qa-reason{font-size:12px;color:#889;line-height:1.5;word-break:break-word}
.qa-scores{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.qa-score{font-size:11px;padding:2px 6px;border-radius:3px}
.qa-total{font-size:13px;font-weight:600;flex-shrink:0;width:50px;text-align:center}
.qa-total.t-broken{color:#ff4444}
.qa-total.t-low{color:#f87171}
.qa-total.t-mid{color:#fbbf24}
.qa-summary{padding:12px;margin-bottom:12px;background:#1e1a2e;border-radius:8px;display:flex;gap:20px;flex-wrap:wrap;font-size:13px}
.qa-summary .stat{text-align:center}
.qa-summary .stat-val{font-size:22px;font-weight:700}
.qa-summary .stat-label{color:#889;font-size:11px}
</style>
</head>
<body>

<nav class="dev-nav">
  <a href="/dev/">Hub</a>
  <a href="/forge.html">Forge</a>
  <a href="/dev/sprites" class="active">Sprites</a>
  <a href="/dev/content">Content</a>
  <a href="/creatures-gallery.html">Creatures</a>
  <a href="/regen-review.html">Regen Review</a>
  <a href="/assets/sprites/items/review.html">Items Review</a>
</nav>

<div class="topbar">
  <div class="topbar-row">
    <div class="tabs" id="tabs">
      <button class="tab active" data-cat="creatures">Creatures</button>
      <button class="tab" data-cat="moves">Actions</button>
      <button class="tab" data-cat="items">Items</button>
      <button class="tab" data-cat="enemies">Enemies</button>
      <button class="tab" data-cat="bosses">Bosses</button>
      <button class="tab" data-cat="npcs">NPCs</button>
      <button class="tab" data-cat="backgrounds">Backgrounds</button>
      <button class="tab" data-cat="player">Player</button>
      <button class="tab" data-cat="starterVariants">Variants</button>
      <button class="tab" data-cat="review">Needs Review (<span id="review-count">0</span>)</button>
      <button class="tab" data-cat="qa" style="color:#f87171">QA Failures (<span id="qa-count">0</span>)</button>
    </div>
    <input class="search" id="search" type="text" placeholder="Search...">
    <button class="toggle" id="orphanToggle">Orphans</button>
    <button class="toggle" id="flaggedToggle">Flagged</button>
    <span class="stats" id="stats"></span>
    <button class="refresh-btn" id="refresh" title="Refresh">&#x21bb;</button>
  </div>
</div>

<div class="grid" id="grid"></div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────
let manifest = null;
let feedback = {};
let activeCat = 'creatures';
let searchText = '';
let orphansOnly = false;
let flaggedOnly = false;
let reviewQueue = { pending: [] };
let reviewSort = 'score-asc';
let qaFailures = [];
let qaSort = 'score-asc';

// ── Sprite paths ──────────────────────────────────────────────────
const SPRITE_DIRS = {
  creatures: '/assets/sprites/creatures/',
  moves: '/assets/sprites/actions/',
  items: '/assets/sprites/items/',
  enemies: '/assets/sprites/enemies/',
  bosses: '/assets/sprites/enemies/',
  npcs: '/assets/sprites/npcs/',
  player: '/assets/sprites/player/',
  starterVariants: '/assets/sprites/starter-variants/'
  // backgrounds use per-item spritePath instead
};

function feedbackKey(cat, item) {
  const catKey = cat === 'moves' ? 'moves' : cat;
  if (cat === 'moves') {
    return 'moves/' + item.spriteFile.replace('.webp', '');
  }
  return catKey + '/' + item.id;
}

function getFeedback(cat, item) {
  return feedback[feedbackKey(cat, item)] || null;
}

// ── Data loading ──────────────────────────────────────────────────
async function loadData() {
  const [mRes, fRes] = await Promise.all([
    fetch('/dev/api/manifest'),
    fetch('/dev/api/feedback')
  ]);
  manifest = await mRes.json();
  feedback = await fRes.json();
  render();
}

// ── Filtering ─────────────────────────────────────────────────────
function getFiltered() {
  let items = manifest[activeCat] || [];
  if (searchText) {
    const q = searchText.toLowerCase();
    items = items.filter(it =>
      (it.id && it.id.toLowerCase().includes(q)) ||
      (it.name && it.name.toLowerCase().includes(q)) ||
      (it.nameEn && it.nameEn.toLowerCase().includes(q))
    );
  }
  if (orphansOnly) {
    items = items.filter(it => it.hasData === false);
  }
  if (flaggedOnly) {
    items = items.filter(it => {
      const fb = getFeedback(activeCat, it);
      return fb && fb.flagged;
    });
  }
  return items;
}

// ── Render grid ───────────────────────────────────────────────────
function render() {
  if (activeCat === 'review') { renderReview(); return; }
  if (activeCat === 'qa') { renderQA(); return; }
  if (!manifest) return;
  const items = getFiltered();
  const grid = document.getElementById('grid');
  const summary = manifest.summary[activeCat];
  const statsEl = document.getElementById('stats');

  if (summary) {
    const spriteCount = summary.withSprite !== undefined ? summary.withSprite : '?';
    statsEl.textContent = spriteCount + '/' + summary.total + ' sprites';
  } else {
    statsEl.textContent = '';
  }

  if (items.length === 0) {
    grid.innerHTML = '<div class="empty">No sprites found</div>';
    return;
  }

  grid.innerHTML = items.map(it => {
    const fb = getFeedback(activeCat, it);
    const dir = it.spritePath || SPRITE_DIRS[activeCat];
    const isCreature = activeCat === 'creatures';
    const isBg = activeCat === 'backgrounds';
    let badges = '';
    if (it.hasData === false) badges += '<span class="badge badge-orphan">orphan</span>';
    if (!it.hasSprite) badges += '<span class="badge badge-missing">no sprite</span>';
    if (fb && fb.flagged) badges += '<span class="badge badge-flagged">' + (fb.notes ? fb.notes.length : 0) + '</span>';
    if (isBg && it.fileCount > 1) badges += '<span class="badge" style="background:#0f3460;color:#8cf">' + it.fileCount + '</span>';

    let imgHtml;
    if (!it.hasSprite) {
      imgHtml = '<div class="placeholder">?</div>';
    } else if (isCreature && it.hasIdle) {
      imgHtml = '<img class="img-idle" src="' + dir + it.idleFile + '" loading="lazy" alt="' + esc(it.nameEn) + '" onerror="this.parentNode.innerHTML=\'<div class=placeholder>?</div>\'">'
        + '<img class="img-static" src="' + dir + it.spriteFile + '" loading="lazy" alt="' + esc(it.nameEn) + '">';
    } else {
      imgHtml = '<img src="' + dir + it.spriteFile + '" loading="lazy" alt="' + esc(it.nameEn) + '" onerror="this.parentNode.innerHTML=\'<div class=placeholder>?</div>\'">';
    }

    return '<div class="card" data-id="' + esc(it.id) + '">'
      + badges
      + '<div class="card-img-wrap' + (isBg ? ' bg-thumb' : '') + '">' + imgHtml + '</div>'
      + '<div class="card-name">' + esc(it.nameEn || it.id) + '</div>'
      + '<div class="card-jp">' + esc(it.name || '') + '</div>'
      + '</div>';
  }).join('');
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Modal ─────────────────────────────────────────────────────────
function openModal(cat, item) {
  const overlay = document.getElementById('overlay');
  const modal = document.getElementById('modal');
  const dir = SPRITE_DIRS[cat];
  const fb = getFeedback(cat, item);
  const key = feedbackKey(cat, item);

  let spritesHtml = '';
  if (cat === 'creatures') {
    spritesHtml = '<div class="modal-sprites">';
    if (item.hasSprite) spritesHtml += '<figure><img src="' + dir + item.spriteFile + '" alt="static"><figcaption>Static</figcaption></figure>';
    if (item.hasIdle) spritesHtml += '<figure><img src="' + dir + item.idleFile + '" alt="idle"><figcaption>Idle (animated)</figcaption></figure>';
    if (!item.hasSprite && !item.hasIdle) spritesHtml += '<div class="placeholder" style="width:150px;height:150px;font-size:40px">?</div>';
    spritesHtml += '</div>';
  } else if (cat === 'backgrounds' && item.files && item.files.length > 1) {
    // Background gallery - show all variant files in a scrollable grid
    spritesHtml = '<div class="modal-bg-gallery">';
    for (const file of item.files) {
      spritesHtml += '<figure><img src="' + item.spritePath + file + '" alt="' + esc(file) + '" loading="lazy"><figcaption>' + esc(file.replace('.webp', '')) + '</figcaption></figure>';
    }
    spritesHtml += '</div>';
  } else {
    spritesHtml = '<div class="modal-sprites">';
    if (item.hasSprite) {
      spritesHtml += '<figure><img src="' + dir + item.spriteFile + '" alt="sprite"></figure>';
    } else {
      spritesHtml += '<div class="placeholder" style="width:150px;height:150px;font-size:40px">?</div>';
    }
    spritesHtml += '</div>';
  }

  // Metadata tags
  let metaHtml = '<div class="modal-meta">';
  if (item.id) metaHtml += '<span>id: ' + esc(item.id) + '</span>';
  if (item.element) metaHtml += '<span>' + esc(item.element) + '</span>';
  if (item.category) metaHtml += '<span>' + esc(item.category) + '</span>';
  if (item.tier !== undefined) metaHtml += '<span>T' + item.tier + '</span>';
  if (item.rarity) metaHtml += '<span>' + esc(item.rarity) + '</span>';
  if (item.type) metaHtml += '<span>' + esc(item.type) + '</span>';
  if (item.floor !== undefined && item.floor !== null) metaHtml += '<span>Floor ' + item.floor + '</span>';
  if (item.area) metaHtml += '<span>area: ' + esc(item.area) + '</span>';
  if (item.baseName) metaHtml += '<span>base: ' + esc(item.baseName) + '</span>';
  if (item.fileCount) metaHtml += '<span>' + item.fileCount + ' files</span>';
  if (item.hasData === false) metaHtml += '<span style="background:#5a2d00;color:#e67e22">orphan</span>';
  if (!item.hasSprite) metaHtml += '<span style="background:#333;color:#aaa">no sprite file</span>';
  if (item.description) metaHtml += '<br><span style="background:transparent;color:#889;font-style:italic">' + esc(item.description) + '</span>';
  metaHtml += '</div>';

  // Feedback section
  const notes = (fb && fb.notes) ? fb.notes : [];
  let notesHtml = '';
  if (notes.length > 0) {
    notesHtml = '<ul class="feedback-notes">' + notes.map((n, i) =>
      '<li>' + esc(n) + '<button data-rm="' + i + '" title="Remove">&times;</button></li>'
    ).join('') + '</ul>';
  }

  modal.innerHTML = '<button class="modal-close">&times;</button>'
    + '<h3>' + esc(item.nameEn || item.id) + '</h3>'
    + '<div class="jp-name">' + esc(item.name || '') + '</div>'
    + spritesHtml
    + metaHtml
    + '<div class="feedback-section">'
    + '<h4>Feedback</h4>'
    + notesHtml
    + '<div class="feedback-row">'
    + '<input class="feedback-input" id="fbInput" placeholder="Add a note...">'
    + '<button class="btn btn-flag" id="fbAdd">Flag</button>'
    + '</div>'
    + (notes.length > 0 ? '<button class="btn btn-clear" id="fbClear">Clear all feedback</button>' : '')
    + '</div>';

  overlay.classList.add('open');
  modal.classList.toggle('modal-wide', cat === 'backgrounds' && item.files && item.files.length > 1);

  // Event handlers
  modal.querySelector('.modal-close').onclick = closeModal;

  document.getElementById('fbAdd').onclick = function() {
    const input = document.getElementById('fbInput');
    const note = input.value.trim();
    if (!note) return;
    if (!feedback[key]) feedback[key] = { notes: [], flagged: true, createdAt: new Date().toISOString() };
    feedback[key].notes.push(note);
    feedback[key].flagged = true;
    feedback[key].updatedAt = new Date().toISOString();
    saveFeedback();
    openModal(cat, item); // re-render modal
    render(); // update badge
  };

  const clearBtn = document.getElementById('fbClear');
  if (clearBtn) {
    clearBtn.onclick = function() {
      delete feedback[key];
      saveFeedback();
      openModal(cat, item);
      render();
    };
  }

  // Remove individual note
  modal.querySelectorAll('[data-rm]').forEach(btn => {
    btn.onclick = function() {
      const idx = parseInt(this.dataset.rm);
      if (feedback[key] && feedback[key].notes) {
        feedback[key].notes.splice(idx, 1);
        if (feedback[key].notes.length === 0) {
          delete feedback[key];
        } else {
          feedback[key].updatedAt = new Date().toISOString();
        }
        saveFeedback();
        openModal(cat, item);
        render();
      }
    };
  });
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
}

async function saveFeedback() {
  try {
    await fetch('/dev/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(feedback)
    });
  } catch (e) {
    console.error('Failed to save feedback:', e);
  }
}

// ── Review Queue ──────────────────────────────────────────────────

async function loadReviewQueue() {
  try {
    const res = await fetch('/dev/api/review-queue');
    reviewQueue = await res.json();
  } catch (e) {
    console.error('Failed to load review queue:', e);
    reviewQueue = { pending: [] };
  }
  document.getElementById('review-count').textContent = reviewQueue.pending.length;
  renderReview();
}

function scoreClass(val) {
  if (val >= 4) return 'score-green';
  if (val >= 3) return 'score-yellow';
  return 'score-red';
}

function renderReview() {
  const grid = document.getElementById('grid');
  const statsEl = document.getElementById('stats');
  const pending = reviewQueue.pending || [];

  statsEl.textContent = pending.length + ' pending review';

  if (pending.length === 0) {
    grid.innerHTML = '<div class="empty">No sprites pending review</div>';
    return;
  }

  // Sort
  let sorted = pending.slice();
  if (reviewSort === 'score-asc') {
    sorted.sort(function(a, b) {
      var aScore = (a.candidates && a.candidates[0]) ? a.candidates[0].totalScore || 0 : 0;
      var bScore = (b.candidates && b.candidates[0]) ? b.candidates[0].totalScore || 0 : 0;
      return aScore - bScore;
    });
  } else if (reviewSort === 'name') {
    sorted.sort(function(a, b) { return (a.id || '').localeCompare(b.id || ''); });
  }

  // Count entries with candidates for batch accept
  var batchCount = sorted.filter(function(e) { return e.candidates && e.candidates.length > 0; }).length;

  var html = '<div class="review-list">';

  // Batch accept button
  if (batchCount > 0) {
    html += '<button class="btn-batch" id="batchAccept">Accept all top-scored (' + batchCount + ')</button>';
  }

  // Sort controls
  html += '<div class="review-sort">'
    + '<label>Sort by:</label>'
    + '<select id="reviewSortSelect">'
    + '<option value="score-asc"' + (reviewSort === 'score-asc' ? ' selected' : '') + '>Lowest score first</option>'
    + '<option value="name"' + (reviewSort === 'name' ? ' selected' : '') + '>Name</option>'
    + '</select>'
    + '</div>';

  for (var ei = 0; ei < sorted.length; ei++) {
    var entry = sorted[ei];
    var typeDir = typeDirForClient(entry.type);
    var word = entry.word || '';

    html += '<div class="review-entry" data-review-id="' + esc(entry.id) + '" data-review-type="' + esc(entry.type) + '">';

    // Header
    html += '<div class="review-header">'
      + esc(entry.id)
      + (word ? '<span class="jp">(' + esc(word) + ')</span>' : '')
      + '</div>';

    // Candidates
    var candidates = entry.candidates || [];
    if (candidates.length > 0) {
      html += '<div class="review-candidates">';
      for (var ci = 0; ci < candidates.length; ci++) {
        var c = candidates[ci];
        var imgSrc = '/dev/staging/' + typeDir + '/' + c.file;
        html += '<div class="review-candidate' + (candidates.length <= 2 ? ' large' : '') + '">';
        html += '<img src="' + esc(imgSrc) + '" alt="' + esc(c.file) + '" loading="lazy" onerror="this.style.display=\'none\'">';
        html += '<div class="review-total">' + (c.totalScore || '?') + '/' + (c.maxScore || '15') + '</div>';
        html += '<div class="review-scores">';
        if (c.scores) {
          var scoreKeys = Object.keys(c.scores);
          for (var si = 0; si < scoreKeys.length; si++) {
            var sk = scoreKeys[si];
            var sv = c.scores[sk];
            html += '<span class="score ' + scoreClass(sv) + '">' + esc(sk) + ':' + sv + '</span> ';
          }
        }
        html += '</div>';
        html += '<button class="btn-pick" data-pick-file="' + esc(c.file) + '">Pick</button>';
        html += '</div>';
      }
      html += '</div>';
    }

    // Rejected candidates
    var rejected = entry.rejected || [];
    if (rejected.length > 0) {
      html += '<div class="review-rejected">';
      for (var ri = 0; ri < rejected.length; ri++) {
        var r = rejected[ri];
        var rejImgSrc = '/dev/staging/' + typeDir + '/' + r.file;
        html += '<div class="review-rejected-item" title="' + esc((r.gate || 'rejected') + (r.reason ? ': ' + r.reason : '')) + '">';
        html += '<img src="' + esc(rejImgSrc) + '" alt="rejected" loading="lazy" onerror="this.style.display=\'none\'">';
        html += '<div>' + esc(r.gate || 'rejected') + '</div>';
        html += '</div>';
      }
      html += '</div>';
    }

    // Actions
    html += '<div class="review-actions">';
    html += '<button class="btn-reject" data-reject-toggle="1">Reject All &rarr; Regen</button>';
    html += '<span class="reject-note-wrap" style="display:none">';
    html += '<input class="reject-note-input" placeholder="Note (optional)...">';
    html += '<button class="btn-reject" data-reject-confirm="1">Confirm Reject</button>';
    html += '</span>';
    html += '</div>';

    html += '</div>'; // .review-entry
  }

  html += '</div>'; // .review-list
  grid.innerHTML = html;

  // Wire up event delegation for review actions
  wireReviewEvents();
}

function typeDirForClient(type) {
  var map = {
    action: 'actions',
    creature: 'creatures',
    item: 'items',
    boss: 'bosses',
    npc: 'npcs',
    background: 'backgrounds'
  };
  return map[type] || type;
}

function wireReviewEvents() {
  var grid = document.getElementById('grid');

  // Sort select
  var sortSelect = document.getElementById('reviewSortSelect');
  if (sortSelect) {
    sortSelect.addEventListener('change', function() {
      reviewSort = this.value;
      renderReview();
    });
  }

  // Batch accept
  var batchBtn = document.getElementById('batchAccept');
  if (batchBtn) {
    batchBtn.addEventListener('click', async function() {
      var pending = reviewQueue.pending || [];
      var ids = [];
      for (var i = 0; i < pending.length; i++) {
        if (pending[i].candidates && pending[i].candidates.length > 0) {
          ids.push({ id: pending[i].id, type: pending[i].type });
        }
      }
      if (ids.length === 0) return;
      batchBtn.disabled = true;
      batchBtn.textContent = 'Accepting...';
      try {
        await fetch('/dev/api/review-queue/batch-accept', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ids: ids })
        });
        await loadReviewQueue();
      } catch (e) {
        console.error('Batch accept failed:', e);
        batchBtn.disabled = false;
        batchBtn.textContent = 'Accept all top-scored (' + ids.length + ')';
      }
    });
  }

  // Pick buttons
  grid.addEventListener('click', async function(e) {
    var pickBtn = e.target.closest('[data-pick-file]');
    if (pickBtn) {
      var entry = pickBtn.closest('.review-entry');
      var id = entry.dataset.reviewId;
      var type = entry.dataset.reviewType;
      var file = pickBtn.dataset.pickFile;
      pickBtn.disabled = true;
      pickBtn.textContent = 'Picking...';
      try {
        await fetch('/dev/api/review-queue/pick', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: id, type: type, file: file })
        });
        await loadReviewQueue();
      } catch (err) {
        console.error('Pick failed:', err);
        pickBtn.disabled = false;
        pickBtn.textContent = 'Pick';
      }
      return;
    }

    // Reject toggle - show note input
    var rejectToggle = e.target.closest('[data-reject-toggle]');
    if (rejectToggle) {
      var wrap = rejectToggle.closest('.review-actions').querySelector('.reject-note-wrap');
      if (wrap) {
        wrap.style.display = wrap.style.display === 'none' ? 'inline-flex' : 'none';
      }
      return;
    }

    // Reject confirm
    var rejectConfirm = e.target.closest('[data-reject-confirm]');
    if (rejectConfirm) {
      var entryEl = rejectConfirm.closest('.review-entry');
      var rId = entryEl.dataset.reviewId;
      var rType = entryEl.dataset.reviewType;
      var noteInput = entryEl.querySelector('.reject-note-input');
      var note = noteInput ? noteInput.value.trim() : '';
      rejectConfirm.disabled = true;
      rejectConfirm.textContent = 'Rejecting...';
      try {
        await fetch('/dev/api/review-queue/reject', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: rId, type: rType, note: note })
        });
        await loadReviewQueue();
      } catch (err) {
        console.error('Reject failed:', err);
        rejectConfirm.disabled = false;
        rejectConfirm.textContent = 'Confirm Reject';
      }
      return;
    }
  });
}

// ── QA Failures ──────────────────────────────────────────────────

async function loadQAFailures() {
  try {
    const res = await fetch('/dev/api/qa-failures');
    qaFailures = await res.json();
  } catch (e) {
    console.error('Failed to load QA failures:', e);
    qaFailures = [];
  }
  document.getElementById('qa-count').textContent = qaFailures.length;
  if (activeCat === 'qa') renderQA();
}

function renderQA() {
  var grid = document.getElementById('grid');
  var statsEl = document.getElementById('stats');

  if (qaFailures.length === 0) {
    statsEl.textContent = 'No QA failures';
    grid.innerHTML = '<div class="empty">All sprites passed QA</div>';
    return;
  }

  // Sort
  var sorted = qaFailures.slice();
  if (qaSort === 'score-asc') {
    sorted.sort(function(a, b) { return a.total - b.total; });
  } else {
    sorted.sort(function(a, b) { return a.id.localeCompare(b.id); });
  }

  // Summary stats
  var broken = sorted.filter(function(f) { return f.total <= 5; }).length;
  var pixelArt = sorted.filter(function(f) { return f.style <= 1; }).length;
  var conceptFail = sorted.filter(function(f) { return f.concept < 3 && f.style >= 3; }).length;
  var styleFail = sorted.filter(function(f) { return f.style < 3 && f.concept >= 3; }).length;

  statsEl.textContent = sorted.length + ' failures';

  var html = '<div class="review-list">';

  // Summary bar
  html += '<div class="qa-summary">';
  html += '<div class="stat"><div class="stat-val" style="color:#f87171">' + sorted.length + '</div><div class="stat-label">Total Failures</div></div>';
  html += '<div class="stat"><div class="stat-val" style="color:#ff4444">' + broken + '</div><div class="stat-label">Broken (T&le;5)</div></div>';
  html += '<div class="stat"><div class="stat-val" style="color:#c084fc">' + pixelArt + '</div><div class="stat-label">Pixel Art (S&le;1)</div></div>';
  html += '<div class="stat"><div class="stat-val" style="color:#fbbf24">' + conceptFail + '</div><div class="stat-label">Bad Concept</div></div>';
  html += '<div class="stat"><div class="stat-val" style="color:#fb923c">' + styleFail + '</div><div class="stat-label">Bad Style</div></div>';
  html += '</div>';

  // Sort control
  html += '<div class="review-sort">';
  html += '<label>Sort by:</label>';
  html += '<select id="qaSortSelect">';
  html += '<option value="score-asc"' + (qaSort === 'score-asc' ? ' selected' : '') + '>Worst first</option>';
  html += '<option value="name"' + (qaSort === 'name' ? ' selected' : '') + '>Name</option>';
  html += '</select>';
  html += '</div>';

  for (var i = 0; i < sorted.length; i++) {
    var f = sorted[i];
    var totalClass = f.total <= 5 ? 't-broken' : f.total <= 8 ? 't-low' : 't-mid';
    html += '<div class="qa-entry' + (f.total <= 5 ? ' qa-broken' : '') + '">';
    html += '<img src="' + esc(f.path) + '" alt="' + esc(f.id) + '" loading="lazy" onerror="this.style.opacity=0.3">';
    html += '<div class="qa-info">';
    html += '<div class="qa-name">' + esc(f.wordEn || f.id) + '</div>';
    html += '<div class="qa-scores">';
    html += '<span class="qa-score ' + scoreClass(f.concept) + '">Concept:' + f.concept + '</span>';
    html += '<span class="qa-score ' + scoreClass(f.style) + '">Style:' + f.style + '</span>';
    html += '<span class="qa-score ' + scoreClass(f.readability) + '">Read:' + f.readability + '</span>';
    html += '</div>';
    if (f.reasoning) html += '<div class="qa-reason">' + esc(f.reasoning) + '</div>';
    html += '</div>';
    html += '<div class="qa-total ' + totalClass + '">' + f.total + '/15</div>';
    html += '</div>';
  }

  html += '</div>';
  grid.innerHTML = html;

  // Sort handler
  var sortSelect = document.getElementById('qaSortSelect');
  if (sortSelect) {
    sortSelect.addEventListener('change', function() {
      qaSort = this.value;
      renderQA();
    });
  }
}

// ── Event wiring ──────────────────────────────────────────────────

// Tabs
document.getElementById('tabs').addEventListener('click', function(e) {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  activeCat = tab.dataset.cat;
  // Show/hide search and filter controls for review/qa tabs
  const hideControls = activeCat === 'review' || activeCat === 'qa';
  document.getElementById('search').style.display = hideControls ? 'none' : '';
  document.getElementById('orphanToggle').style.display = hideControls ? 'none' : '';
  document.getElementById('flaggedToggle').style.display = hideControls ? 'none' : '';
  if (activeCat === 'review') {
    loadReviewQueue();
  } else if (activeCat === 'qa') {
    loadQAFailures();
  } else {
    render();
  }
});

// Search
let searchTimer;
document.getElementById('search').addEventListener('input', function() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function() {
    searchText = document.getElementById('search').value;
    render();
  }, 150);
});

// Orphan toggle
document.getElementById('orphanToggle').addEventListener('click', function() {
  orphansOnly = !orphansOnly;
  this.classList.toggle('on', orphansOnly);
  render();
});

// Flagged toggle
document.getElementById('flaggedToggle').addEventListener('click', function() {
  flaggedOnly = !flaggedOnly;
  this.classList.toggle('flagged-on', flaggedOnly);
  render();
});

// Refresh
document.getElementById('refresh').addEventListener('click', function() {
  if (activeCat === 'review') {
    loadReviewQueue();
  } else if (activeCat === 'qa') {
    loadQAFailures();
  } else {
    loadData();
  }
});

// Card clicks -> modal
document.getElementById('grid').addEventListener('click', function(e) {
  const card = e.target.closest('.card');
  if (!card) return;
  const id = card.dataset.id;
  const items = manifest[activeCat] || [];
  const item = items.find(it => it.id === id);
  if (item) openModal(activeCat, item);
});

// Close modal on overlay click
document.getElementById('overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Close on Escape
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

// ── Init ──────────────────────────────────────────────────────────
async function init() {
  // Check auth first — if API returns 401, redirect to login
  const check = await fetch('/dev/api/manifest');
  if (check.status === 401) {
    window.location.href = '/dev/login';
    return;
  }
  manifest = await check.json();
  const fRes = await fetch('/dev/api/feedback');
  feedback = await fRes.json();
  render();
  loadQAFailures();
}
init();
</script>
